name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voltaura-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare app.apk
        run: cp $(find app/build/outputs/apk -name '*.apk' | head -1) app.apk
      - name: Publish standard app.apk release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          make_latest: true
          files: app.apk
        env:
          GITHUB_TOKEN: ${ secrets.GITHUB_TOKEN }
